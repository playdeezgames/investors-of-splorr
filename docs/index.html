<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investors of SPLORR!!</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; touch-action: none;
           width: min(100vw, calc((100vh - 3.5rem) * 320 / 192)); }
  footer { padding: 6px 16px; text-align: center; font: 12px/1.4 sans-serif; color: #888; }
  footer a { color: #bbb; }
  body.touch footer { display: none; }
  #pad { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px;
         justify-content: space-between; align-items: flex-end; pointer-events: none;
         user-select: none; -webkit-user-select: none; }
  body.touch #pad { display: flex; }
  #pad button { pointer-events: auto; touch-action: none; font: bold 18px monospace; color: #fff;
                background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.55); border-radius: 12px; }
  #pad button.on { background: rgba(255,255,255,.55); color: #000; }
  #dpad { display: grid; grid-template: repeat(3, 52px) / repeat(3, 52px); gap: 4px; }
  #acts { display: flex; flex-direction: column; gap: 8px; }
  #acts button { width: 84px; height: 56px; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="192"></canvas>
<footer>
  Investors of SPLORR!! by TheGrumpyGameDev. Made with AI: code, sound and words by Claude Code at the author's direction. Art: <a href="https://v3x3d.itch.io/bit-bonanza">Bit Bonanza</a> and <a href="https://v3x3d.itch.io/bountiful-bits">Bountiful Bits</a> by VEXED (CC0), plus sprites by Claude.<span class="ll-only" hidden> Feedback by LootLocker.</span><br>
  <span class="ll-only" hidden><a href="#" id="feedback-link">Send feedback</a> · </span><a href="https://thegrumpygamedev.itch.io/" target="_blank" rel="noopener">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/" target="_blank" rel="noopener">more games</a>
</footer>
<div id="pad">
  <div id="dpad">
    <span></span><button data-act="3" aria-label="up">&#9650;</button><span></span>
    <button data-act="1" aria-label="left">&#9664;</button><span></span><button data-act="2" aria-label="right">&#9654;</button>
    <span></span><button data-act="4" aria-label="down">&#9660;</button><span></span>
  </div>
  <div id="acts">
    <button data-act="5" aria-label="confirm">OK</button>
    <button data-act="6" aria-label="back">BACK</button>
  </div>
</div>
<script type="text/javascript" src="odin.js"></script>
<script src="lootlocker.js"></script>
<script>
// Feedback (the shared SPLORR!! LootLocker kit's form, splorr/Tech/LootLocker.md in the vault): reports go
// to the LootLocker console under Feedback, Game. The link stays hidden until LL_KEY is filled in.
// TODO before shipping with feedback: the LootLocker game's API domain and public Game API key (not a
// secret), with Guest Login on, the CORS Allowlist (https://playdeezgames.github.io,
// https://html-classic.itch.zone, http://localhost:8000) and Game feedback categories (Bug, Idea, Other).
const LL_DOMAIN = "";
const LL_KEY = "";
const feedback = LL_KEY ? LootLocker({
  domain: LL_DOMAIN,
  key: LL_KEY,
  version: "1.0.0",
  idKey: "investors-of-splorr:ll-player",
}).feedbackDialog({ game: "Investors of SPLORR!!" }) : null;
if (feedback) {
  document.querySelectorAll(".ll-only").forEach((el) => { el.hidden = false; });
  document.getElementById("feedback-link").addEventListener("click", (e) => { e.preventDefault(); feedback.open(); });
}
</script>
<script>
  const cv = document.getElementById("screen");
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const css = (rgb) => "#" + (rgb >>> 0).toString(16).padStart(6, "0");

  // Order must match `Sheet` in src/web/web.odin. The sheets are white on transparent; they are tinted at draw time.
  const SHEETS = ["art/sprites_16x16.png", "art/shop_32x32.png", "claude/claude_16x16.png"].map((src) => { const i = new Image(); i.src = src; return i; });
  // DINOBYTE by mby (CC BY 4.0): 6 by 8 glyphs in a 16 by 16 grid, code page 437 order, beige ink.
  const font = new Image();
  font.src = "font.png";
  const GW = 6, GH = 8;

  const tinted = new Map();
  const tint = (img, key, rgb) => {
    const k = key + ":" + rgb;
    let c = tinted.get(k);
    if (!c) {
      c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0);
      g.globalCompositeOperation = "source-in";
      g.fillStyle = css(rgb);
      g.fillRect(0, 0, c.width, c.height);
      tinted.set(k, c);
    }
    return c;
  };

  // Sound effects (PLAY text made in Anvil, exported to WAV). Order must match `Event` in src/game/game.odin.
  const SOUND_FILES = ["coin", "door", "swing", "hurt", "die", "buy", "refuse", "peace"].map((n) => "sfx/" + n + ".wav");
  const sounds = [];
  let audio = null;
  const unlock = () => {
    if (audio) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      SOUND_FILES.forEach((f, i) => fetch(f).then((r) => r.arrayBuffer())
        .then((b) => audio.decodeAudioData(b)).then((buf) => { sounds[i] = buf; }).catch(() => {}));
    } catch (e) { audio = null; }
  };
  for (const ev of ["keydown", "pointerdown"]) window.addEventListener(ev, unlock);

  const memory = new odin.WasmMemoryInterface();
  const press = (a) => { if (memory.exports && memory.exports.press) memory.exports.press(a); };

  // Touch: on-screen buttons send one press each; a tap on the canvas confirms (title and ending screens).
  const showPad = () => document.body.classList.add("touch");
  if (window.matchMedia && matchMedia("(pointer: coarse)").matches) showPad();
  window.addEventListener("touchstart", showPad, { once: true, passive: true });
  for (const b of document.querySelectorAll("#pad button")) {
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      b.classList.add("on");
      press(Number(b.dataset.act));
    });
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => b.classList.remove("on"));
  }
  cv.addEventListener("pointerdown", () => press(5));

  // QA: index.html#keys=CRRDDC replays presses at load (L R U D C=confirm X=cancel), for screenshots.
  const qa = /^#keys=([LRUDCX]*)$/.exec(location.hash);
  if (qa) {
    const t = setInterval(() => {
      if (memory.exports && memory.exports.press) {
        clearInterval(t);
        // The key queue holds 128, so drain every 64 presses.
        [...qa[1]].forEach((ch, i) => {
          press({ L: 1, R: 2, U: 3, D: 4, C: 5, X: 6 }[ch]);
          if (i % 64 === 63) memory.exports.qa_drain();
        });
        memory.exports.qa_drain();
      }
    }, 50);
  }

  odin.runWasm("game.wasm", null, {
    canvas: {
      fill_rect: (x, y, w, h, rgb, alpha) => {
        ctx.globalAlpha = alpha; ctx.fillStyle = css(rgb); ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
      },
      blit: (sheet, col, row, size, x, y, rgb) => {
        const img = SHEETS[sheet];
        if (!img.complete || !img.naturalWidth) return;
        ctx.drawImage(tint(img, "s" + sheet, rgb), col * size, row * size, size, size, Math.round(x), Math.round(y), size, size);
      },
      play_sound: (id) => {
        if (!audio || !sounds[id]) return;
        const src = audio.createBufferSource();
        src.buffer = sounds[id];
        const gain = audio.createGain();
        gain.gain.value = 0.3;
        src.connect(gain).connect(audio.destination);
        src.start();
      },
      draw_text: (x, y, ptr, len, rgb, scale, centered) => {
        if (!font.complete || !font.naturalWidth) return;
        const str = memory.loadString(ptr, len);
        const sheet = tint(font, "font", rgb);
        const w = str.length * GW * scale;
        let px = Math.round(centered ? x - w / 2 : x);
        for (const ch of str) {
          const code = ch.charCodeAt(0) & 255;
          ctx.drawImage(sheet, (code % 16) * GW, Math.floor(code / 16) * GH, GW, GH, px, Math.round(y), GW * scale, GH * scale);
          px += GW * scale;
        }
      },
    },
  }, memory);
</script>
</body>
</html>
